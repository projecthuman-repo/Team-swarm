# Required checks (runbook §12). ALL of these must pass before the
# Forgejo API auto-merge to `integration` fires. Any non-zero exit blocks.
name: ci
on:
  pull_request:
  push:
    branches: [integration, "feature/**"]

jobs:
  gates:
    runs-on: docker
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: uv-

      - name: locked environment (uv.lock is the source of truth, L1.2)
        # uv is pinned to the version that wrote uv.lock (DECISIONS D-002).
        run: |
          pip install --quiet uv==0.11.32
          uv sync --frozen --group agent --group dev
          uv lock --check

      - name: generated requirements match uv.lock
        # requirements*.txt are generated; a hand edit (or a stale export)
        # fails here, which is what lets the diff-size gate skip them.
        run: |
          sha1sum uv.lock requirements*.txt > "${TMPDIR:-/tmp}/lock.sha"
          ./scripts/lock_export.sh
          sha1sum -c --quiet "${TMPDIR:-/tmp}/lock.sha"

      - name: install syft (license gate)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      # Every gate runs in the synced env; --no-sync keeps `uv run` from
      # re-syncing to the default groups and dropping the agent group.
      - name: lint (ruff)
        run: uv run --no-sync ruff check .

      - name: tests + coverage floor
        # floor = current honest coverage; ratchet it up as the suite grows
        run: uv run --no-sync pytest --cov=agent --cov=ingest --cov-fail-under=20 -q

      - name: security scan (bandit)
        # medium+ blocks; Low subprocess-usage notes are accepted (the
        # engines ARE subprocesses — list args, never shell=True)
        run: uv run --no-sync bandit -q -r agent ingest scripts -x tests --severity-level medium

      - name: diff-size limit
        run: bash .forgejo/scripts/diff_size_gate.sh

      - name: headroom gate (token compression, v4.1 T1.1)
        # chopratejas/headroom (PyPI headroom-ai, Apache-2.0) — compresses
        # checked-in fixtures and asserts ratio floor + CCR round-trip.
        # Isolated venv: headroom-ai==0.31.0 cannot co-install with aider-chat
        # (litellm >=1.86.2 vs ==1.81.10), so it NEVER enters the agent env.
        run: |
          uv venv --python 3.12 /tmp/headroom-env
          uv pip install --python /tmp/headroom-env/bin/python headroom-ai==0.31.0
          /tmp/headroom-env/bin/python .forgejo/scripts/headroom_gate.py

      - name: license gate (fail-closed)
        run: uv run --no-sync python .forgejo/scripts/license_gate.py

  proto-compat:
    runs-on: docker
    container:
      image: bufbuild/buf:latest
    steps:
      - uses: actions/checkout@v4
      - name: buf lint
        run: buf lint
      - name: buf breaking (against integration)
        run: |
          buf breaking --against \
            ".git#branch=origin/integration,subdir=." || true

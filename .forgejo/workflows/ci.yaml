# Required checks (runbook §12). ALL of these must pass before the
# Forgejo API auto-merge to `integration` fires. Any non-zero exit blocks.
name: ci
on:
  pull_request:
  push:
    branches: [integration, "feature/**"]

jobs:
  gates:
    runs-on: docker
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install tooling
        run: |
          pip install --quiet ruff pytest pytest-cov bandit -r requirements.txt
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: lint (ruff)
        run: ruff check .

      - name: tests + coverage floor
        # floor = current honest coverage; ratchet it up as the suite grows
        run: pytest --cov=agent --cov=ingest --cov-fail-under=20 -q

      - name: security scan (bandit)
        # medium+ blocks; Low subprocess-usage notes are accepted (the
        # engines ARE subprocesses — list args, never shell=True)
        run: bandit -q -r agent ingest scripts -x tests --severity-level medium

      - name: diff-size limit
        run: bash .forgejo/scripts/diff_size_gate.sh

      - name: headroom gate (token compression, v4.1 T1.1)
        # chopratejas/headroom (PyPI headroom-ai, Apache-2.0) — compresses
        # checked-in fixtures and asserts ratio floor + CCR round-trip.
        # (Replaces the mis-wired gglucass/headroom-desktop step: that is a
        # paid desktop tray app, not the compression library.)
        run: |
          pip install --quiet --only-binary headroom-ai headroom-ai
          python .forgejo/scripts/headroom_gate.py

      - name: license gate (fail-closed)
        run: python .forgejo/scripts/license_gate.py

  proto-compat:
    runs-on: docker
    container:
      image: bufbuild/buf:latest
    steps:
      - uses: actions/checkout@v4
      - name: buf lint
        run: buf lint
      - name: buf breaking (against integration)
        run: |
          buf breaking --against \
            ".git#branch=origin/integration,subdir=." || true

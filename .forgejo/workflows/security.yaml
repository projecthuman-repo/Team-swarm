# Strix autonomous security-review workflow (v4.2 T8.2).
#
# SEPARATE from ci.yaml — the always-on bandit static gate there is
# UNTOUCHED. This adds dynamic DAST/pentest depth on the diff.
#
# Starts ADVISORY (continue-on-error: findings are posted, the PR is not
# blocked) for a burn-in window. Promote to blocking (drop continue-on-
# error) once the false-positive rate is acceptable on the swarm's own
# history. Inference stays self-hosted via LLM_API_BASE (Ornith).
name: security
on:
  pull_request:
    branches: [integration]

jobs:
  strix:
    runs-on: docker
    # Strix needs Docker-in-the-loop; this runner label provides it.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install strix from uv.lock (opt-in security lane, isolated env)
        # The locked `security` group (strix-agent, pinned in uv.lock). It
        # conflicts with the agent group, so it never shares an environment
        # with the agent — same pattern as the headroom environment in ci.yaml.
        run: |
          pip install --quiet uv==0.11.32
          UV_PROJECT_ENVIRONMENT=/tmp/strix-env \
            uv sync --frozen --no-install-project --only-group security

      - name: strix dynamic scan (advisory — burn-in)
        id: strix
        continue-on-error: true # ADVISORY: remove to promote to blocking
        env:
          LLM_API_BASE: ${{ env.LLM_API_BASE }} # self-hosted Ornith gateway
          STRIX_LLM: ${{ env.STRIX_LLM }} # model id at that gateway
          STRIX_TELEMETRY: "false" # no usage callout from the runner
        # strix-agent has no `--output` flag on the scan command; it writes
        # its report to strix_runs/<run>/vulnerabilities.json.
        run: |
          /tmp/strix-env/bin/strix -n -t ./ \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base origin/integration || true
          ls strix_runs/*/vulnerabilities.json 2>/dev/null || echo "no Strix report written"

      - name: route validated findings -> lessons + needs-human
        if: always()
        continue-on-error: true
        run: |
          for report in strix_runs/*/vulnerabilities.json; do
            [ -s "$report" ] || continue
            python scripts/strix_findings.py --report "$report" --no-issues
          done

      # bandit still runs in ci.yaml — this workflow does not touch it.

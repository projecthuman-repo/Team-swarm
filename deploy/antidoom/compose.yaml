# Antidoom offline training env (v4.2 T9.1) — runs on a SEPARATE GPU host,
# outside the swarm runtime path. Never brought up by the main stack.
#   docker compose -f deploy/antidoom/compose.yaml up
services:
  antidoom:
    image: nvidia/cuda:12.4.0-runtime-ubuntu22.04
    # The upstream clone (mounted below): its pyproject.toml provides the
    # `antidoom` script and configs/default.yaml is relative to it. `uv run`
    # finds a project by walking up from the working directory, never down.
    working_dir: /work/antidoom
    # Pin antidoom from Liquid4All/antidoom (Apache-2.0). It uses `uv`, which
    # comes from the host (volume below): a CUDA runtime image is Ubuntu plus
    # the CUDA libraries, with no pip to install it from. uv fetches the
    # Python the clone's .python-version pins.
    command: >-
      uv run antidoom -c configs/default.yaml
      --model-name ${ORNITH_HF_ID:-deepreinforce-ai/Ornith-1.0-9B}
    environment:
      # Target Ornith only — never pull LFM2 checkpoints (T9.3).
      ORNITH_HF_ID: ${ORNITH_HF_ID:-deepreinforce-ai/Ornith-1.0-9B}
      HF_HOME: /work/hf
    volumes:
      - ./work:/work
      - ./antidoom-src:/work/antidoom # git clone Liquid4All/antidoom here
      - ${UV_BIN:-/usr/local/bin/uv}:/usr/local/bin/uv:ro # the host's uv binary (`command -v uv`)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # AMD/ROCm hosts: swap the image for a ROCm base and use
    # configs/default_amd.yaml (attention_backend: TRITON_ATTN).

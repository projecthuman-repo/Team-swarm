# Lite spine (Lean & Precise L1.5) — the smallest stack that runs a task:
#   nats, postgres+pgvector, valkey, openbao.
# No apicurio (schema registration is skipped by scripts/bootstrap.sh), no
# seaweedfs, no ollama — start ollama on demand with `make ollama`.
#
#   make up-lite && make bootstrap && make ollama && make forgejo
#
# Every service here is a byte-for-byte copy of its definition in
# deploy/compose.yaml (same images, env, volumes, networks; enforced by
# tests/test_compose_lite.py). Both files live in deploy/, so they share the
# compose project name and therefore the same containers and named volumes:
# `make up` after `make up-lite` adds the missing services and keeps data.

networks:
  swarm-internal:
    internal: true
  egress: {}

volumes:
  nats-data: {}
  pg-data: {}

services:
  nats:
    image: nats:2.12
    command: ["-js", "-sd", "/data"]
    volumes: ["nats-data:/data"]
    networks: [swarm-internal]
    ports: ["4222:4222", "8222:8222"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: swarm
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: [swarm-internal]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swarm"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0
    networks: [swarm-internal]
    ports: ["6379:6379"]

  openbao:
    image: openbao/openbao:2.5.0
    command: server -dev -dev-root-token-id=dev-root -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    networks: [swarm-internal]
    ports: ["8200:8200"]

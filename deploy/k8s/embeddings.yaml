# Tier B embeddings (review R4): the lessons memory embeds through an
# OpenAI-compatible /v1/embeddings endpoint (EMBEDDING_BACKEND=api). The
# Tier B inference server (vllm.yaml) serves one generative model and no
# embeddings route, so this is a small CPU Ollama serving `all-minilm`
# (384-dim) — the same model and vector space as Tier A, so lessons move
# between tiers without a re-embed.
#
# The model is NOT pulled automatically: the pull is made by this pod, and
# the namespace's default-deny egress policy blocks it. Pull it once, with
# the temporary policy that lets only this pod reach the registry over
# HTTPS, and remove that policy again:
#   kubectl apply  -f deploy/k8s/embeddings-model-pull.yaml
#   kubectl exec -n swarm deploy/embeddings -- ollama pull all-minilm
#   kubectl delete -f deploy/k8s/embeddings-model-pull.yaml
# The model stays on the PVC. Until it is there, agents log the embedding
# error and retrieval is text-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: swarm
spec:
  replicas: 1
  selector:
    matchLabels: { app: embeddings }
  template:
    metadata:
      labels: { app: embeddings }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest # same image as the Tier A compose service
          ports:
            - containerPort: 11434
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: embeddings-models }
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: swarm
spec:
  selector: { app: embeddings }
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embeddings-models
  namespace: swarm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }

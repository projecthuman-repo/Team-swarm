# Skill-runner pod template (Hard Rule 6): untrusted, LLM-selected code
# executes under gVisor (baseline). Swap runtimeClassName to `kata` for a
# dedicated-kernel microVM when the threat model requires it.
apiVersion: v1
kind: Pod
metadata:
  name: skill-runner
  namespace: swarm
  labels: { app: skill-runner }
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: skill
      image: python:3.12-slim
      command: ["/skill/run"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: skill, mountPath: /skill, readOnly: true }
        - { name: work, mountPath: /work }
      resources:
        limits: { cpu: "1", memory: 512Mi }
  volumes:
    - name: skill
      configMap: { name: skill-code, defaultMode: 0555 }
    - name: work
      emptyDir: { sizeLimit: 64Mi }

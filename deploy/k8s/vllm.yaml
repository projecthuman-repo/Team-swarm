# Tier B inference: vLLM serving Ornith-1.0 with the reasoning and
# tool-call parsers the model requires (runbook §13). Continuous batching
# is why vLLM replaces Ollama past ~5 concurrent agents (§15).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: swarm
spec:
  replicas: 1
  selector:
    matchLabels: { app: vllm }
  template:
    metadata:
      labels: { app: vllm }
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model=deepreinforce-ai/Ornith-1.0-35B # 9B on <24GB nodes
            - --served-model-name=Ornith-1.0-35B
            - --max-model-len=262144
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_xml
            - --reasoning-parser=qwen3
            - --trust-remote-code
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: models, mountPath: /root/.cache/huggingface }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: vllm-models }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: swarm
spec:
  selector: { app: vllm }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: swarm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 100Gi }

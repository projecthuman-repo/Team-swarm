# Prometheus for the swarm (Lean & Precise L3.2, compose profile observability).
# Scrapes every agent's health port (/metrics: the SLA gauges of
# agent/sla_metrics.py) and the outbox relay (RELAY_METRICS_PORT, 9464).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: swarm-agents
    metrics_path: /metrics
    static_configs:
      - targets:
          - agent-backend:8080
          - agent-frontend:8080
          - agent-review:8080
          - agent-triage:8080

  - job_name: swarm-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["relay:9464"]

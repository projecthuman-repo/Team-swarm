syntax = "proto3";

package swarm.v1;

// A unit of work for one agent role. Produced by ingest (Forgejo issues,
// chat ingress) and consumed by agent workers via JetStream.
message Task {
  string task_id       = 1;   // UUID
  string role          = 2;   // backend|frontend|review|triage
  string title         = 3;
  string spec_ref      = 4;   // SeaweedFS blob key
  string branch        = 5;   // feature/<task_id>
  int32  attempt       = 6;
  int64  budget_tokens = 7;
  int64  deadline_unix = 8;
  // v4.1 append-only additions (buf breaking stays green):
  string parent_task_id = 9;  // set on planner-emitted subtasks (T3.1)
  string verify_cmd     = 10; // per-subtask verification command (T3.1)
  string tier           = 11; // model tier for capacity routing (T4.2); "" = default
}

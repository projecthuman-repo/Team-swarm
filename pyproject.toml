[project]
name = "overnight-agent-swarm"
version = "4.2.0"
description = "Overnight Agent Swarm v4.2.0 — JetStream + transactional outbox + sandboxed coding agents"
# Every image and CI job runs Python 3.12; the upper bound keeps the
# universal lock solvable (aider-chat pins numpy==1.26.4, which has no
# 3.14 wheels while fastembed needs numpy>=2.3 there). See DECISIONS D-009.
requires-python = ">=3.12,<3.13"
# Shared runtime: what every swarm process imports.
dependencies = [
  "nats-py>=2.9",
  "asyncpg>=0.29",
  "valkey>=6.0",
  "requests>=2.32",
  "protobuf>=7.35.1,<8", # matches the checked-in gencode under agent/gen/ (protoc 7.35.1)
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "psutil>=6.0",
  "prometheus-client>=0.26,<1", # /metrics SLA gauges (L3.2)
  "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
# Default embeddings: fastembed (onnxruntime, no torch) — bge-small-en-v1.5
# is 384-dim, matching vector(384); bge-m3 (1024) also runs through it.
embeddings = ["fastembed>=0.9,<1"]
# torch-based options. torch is listed directly so the (disabled-by-default)
# CPU-wheel source below can apply to it — uv sources only bind direct deps.
embeddings-torch = ["sentence-transformers>=3.0", "torch"]
vector = ["qdrant-client>=1.12", "chromadb>=0.5"]
orchestration = ["langgraph>=0.2", "crewai>=0.80"]
routing = ["routellm>=0.2", "torch"]
ccompat = ["confluent-kafka[protobuf]>=2.6"]
# v4.2 T7.7 — Claude Agent SDK escalation engine, API-fallback lane ONLY
# (hosted fallback, opt-in and off by default — INV-027; never in an image).
# Its wheel bundles the Claude Code CLI, which is under Anthropic's
# Commercial Terms, not the SDK's MIT (conventions/licensing.md).
escalation = ["claude-agent-sdk>=0.2"]

[dependency-groups]
agent = ["aider-chat>=0.86"]
# What the agent's quality gate runs inside the workspace (QUALITY_FAST_CHECK,
# QUALITY_CHECKS). Installed in the agent image with the agent group; without
# them every check was skipped as "not installed" (Phase-3 review).
gate = ["ruff>=0.7", "pytest>=8.0"]
# The ingest image installs with `--only-group ingest`, so the group carries
# everything ingest imports, not just headroom-ai (DECISIONS D-010).
ingest = [
  "asyncpg>=0.29",
  "requests>=2.32",
  "protobuf>=7.35.1,<8",
  "valkey>=6.0",
  "headroom-ai==0.31.0",
]
# The Headroom proxy image (deploy/Containerfile.headroom) installs with
# `--only-group headroom-proxy`: the proxy needs the `proxy` extra (fastapi,
# uvicorn, …) — without it `headroom proxy` exits at start-up (review R1).
headroom-proxy = ["headroom-ai[proxy]==0.31.0"]
# v4.2 Workstream 8 — the Strix security-review lane (opt-in; the advisory
# `security` CI workflow installs exactly this group). Never in an image:
# its closure carries cvss (LGPL-3.0-or-later). conventions/security-scope.md.
security = ["strix-agent>=1.0.4"]
dev = [
  "ruff>=0.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "bandit>=1.7",
  "grpcio-tools>=1.66",
  "pre-commit>=4.0", # MIT; `make hooks`, CI step
  "packaging>=24.2", # Apache-2.0 OR BSD-2-Clause; SPDX parsing in the license gate (R2)
]

[tool.uv]
package = false
# headroom-ai==0.31.0 needs litellm>=1.86.2; aider-chat pins litellm==1.81.10.
conflicts = [
  [{ group = "agent" }, { group = "ingest" }],
  [{ group = "agent" }, { group = "headroom-proxy" }],
  # strix-agent needs openai>=2.45 and litellm>=1.101; aider-chat pins both
  # lower. The other two pairs keep the ingest and headroom image pins
  # exactly as they were (cryptography, websockets would otherwise move).
  [{ group = "agent" }, { group = "security" }],
  [{ group = "ingest" }, { group = "security" }],
  [{ group = "headroom-proxy" }, { group = "security" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# BEGIN torch-cpu-source — enabled by `make torch-cpu-lock` on a host that
# can reach download.pytorch.org (blocked in the session that wrote this
# lock; see DECISIONS D-011). Until then torch resolves from PyPI (CUDA).
# [tool.uv.sources]
# torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# END torch-cpu-source

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["agent/gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402"]  # gen/ sys.path insertion precedes imports by design

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["agent/gen/*"]

[tool.bandit]
exclude_dirs = ["tests", "agent/gen"]
